[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barkly-docs"
version = "0.1.0"
description = "Human-centered documentation and knowledge infrastructure for Barkly Labs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Barkly Labs" }]
dependencies = []

[project.scripts]
barkly-docs = "barkly_docs.cli:main"

[tool.setuptools.packages.find]
include = ["barkly_docs*"]
